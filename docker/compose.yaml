services:

  django:
    image: docker.1ms.run/guxiaotu/x
    restart: always
    ports:
      - "8000:8000/tcp"
    depends_on:
      - mysql

  citus:
    image: docker.1ms.run/citusdata/citus
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Django123456
    volumes:
      - postgres:/var/lib/postgresql/
    ports:
      - "5432:5432"

volumes:
  citus: