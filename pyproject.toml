[project]
name = "groupB_project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard,standard-no-fastapi-cloud-cli]>=0.162.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "sqlacodegen>=4.0.4",
]

[[index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-s"
log_cli = true
log_cli_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
