[project]
name = "groupB_project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.143.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pymysql>=1.2.3",
    "sqlalchemy==2.1.4",
    "sqlmodel==0.0.48",
]

#[tool.fastapi]
#entrypoint = "main:app"

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-s"

[tool.fastapi]
entrypoint = "main:app"
